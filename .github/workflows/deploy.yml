name: PulseGuard CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Native Deployment on VAIO
    runs-on: self-hosted
    steps:
      - name: Deploy Production Containers
        run: |
          echo "==> Intru în directorul de producție al aplicației..."
          cd /home/deployer/PulseGuard

          echo "==> Preluare cod nou din Git..."
          git pull origin main

          echo "==> Rebuild și pornire containere cu variabilele din .env..."
          docker compose up -d --build

          echo "==> Curățare imagini vechi Docker..."
          docker image prune -f

          echo "==> Verificare status containere active..."
          docker compose ps
