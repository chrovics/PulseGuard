name: PulseGuard CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Code with Flake8
        run: |
          # Oprește pipeline-ul doar la erori critice de sintaxă sau variabile nedeclarate
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avertismente de stil (nu blochează livrarea)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    name: Deploy to VAIO Server via Tailscale
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Connect Runner to Tailscale Mesh
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "==> Navighez în directorul proiectului..."
            cd ~/PulseGuard

            echo "==> Trag cele mai recente modificări..."
            git pull origin main

            echo "==> Reconstruiesc și pornesc serviciile..."
            docker compose up -d --build

            echo "==> Curăț imaginile Docker orfane..."
            docker image prune -f

            echo "==> Verific statusul containerelor..."
            docker compose ps
